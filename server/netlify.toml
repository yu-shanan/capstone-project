[build]
  command = "npm install"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_ENV = "production"

[functions]
  node_version = "20"

# Every API path goes to the Express function, keeping the original path.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Service index
[[redirects]]
  from = "/"
  to = "/.netlify/functions/api"
  status = 200
  force = true
